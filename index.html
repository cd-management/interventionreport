<title>Relatório de Intervenção – DIGIWEST</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628; --navy-mid: #152344; --blue: #1a4fa0;
    --blue-bright: #2563eb; --blue-light: #dbeafe; --accent: #f97316;
    --white: #ffffff; --gray-50: #f8fafc; --gray-100: #f1f5f9;
    --gray-200: #e2e8f0; --gray-300: #cbd5e1; --gray-400: #94a3b8;
    --gray-600: #475569; --gray-800: #1e293b; --green: #10b981;
    --radius: 10px; --radius-sm: 6px;
    --shadow-lg: 0 8px 32px rgba(10,22,40,0.15);
    --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',system-ui,sans-serif; background:var(--gray-100); min-height:100vh; color:var(--gray-800); }
  .page { max-width:980px; margin:0 auto; padding:32px 16px 64px; }
  .card { background:var(--white); border-radius:16px; box-shadow:var(--shadow-lg); overflow:hidden; }
  .card-header {
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 60%,var(--blue) 100%);
    padding:32px 40px 28px; position:relative; overflow:hidden;
  }
  .card-header::before { content:''; position:absolute; top:-60px; right:-60px; width:220px; height:220px; border-radius:50%; background:rgba(37,99,235,0.18); }
  .card-header::after { content:''; position:absolute; bottom:-40px; left:40%; width:140px; height:140px; border-radius:50%; background:rgba(249,115,22,0.10); }
  .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; position:relative; z-index:1; }
  .badge-ref { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.92); font-size:11px; font-weight:500; padding:5px 12px; border-radius:999px; letter-spacing:0.04em; }
  .header-title { font-size:26px; font-weight:700; color:var(--white); letter-spacing:-0.01em; position:relative; z-index:1; }
  .header-sub { font-size:13px; color:rgba(255,255,255,0.7); margin-top:6px; position:relative; z-index:1; }
  .card-body { padding:32px 40px; }

  /* Section */
  .section { margin-bottom:24px; }
  .section-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; color:var(--blue); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .section-label::after { content:''; flex:1; height:1px; background:linear-gradient(to right,var(--blue-light),transparent); }

  /* Fields */
  .field-group { display:flex; flex-direction:column; gap:6px; }
  .field-group label { font-size:12px; font-weight:600; color:var(--gray-600); letter-spacing:0.02em; }
  .req { color:var(--accent); margin-left:2px; }
  input[type="text"],input[type="date"],input[type="time"],textarea,select {
    font-family:inherit; font-size:14px; padding:10px 12px;
    background:var(--white); border:1.5px solid var(--gray-200);
    border-radius:var(--radius-sm); color:var(--gray-800);
    transition:var(--transition); width:100%;
  }
  input:focus,textarea:focus,select:focus { outline:none; border-color:var(--blue-bright); box-shadow:0 0 0 3px rgba(37,99,235,0.12); }
  textarea { resize:vertical; min-height:80px; line-height:1.5; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid-2.asym { grid-template-columns:2fr 1fr; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .grid-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:14px; }
  hr { border:none; border-top:1px solid var(--gray-200); margin:24px 0; }

  /* Tipo checkboxes */
  .tipo-group { display:flex; gap:20px; flex-wrap:wrap; }
  .tipo-check { display:flex; align-items:center; gap:8px; cursor:pointer; }
  .tipo-check input { width:16px; height:16px; cursor:pointer; accent-color:var(--blue-bright); }
  .tipo-check span { font-size:13px; font-weight:500; color:var(--gray-600); }

  /* Equipment card */
  .eq-list { display:flex; flex-direction:column; gap:16px; }
  .eq-card {
    border:1.5px solid var(--gray-200); border-radius:var(--radius);
    overflow:hidden; background:var(--gray-50);
  }
  .eq-card-header {
    background:linear-gradient(90deg,var(--navy) 0%,var(--navy-mid) 100%);
    padding:12px 18px; display:flex; justify-content:space-between; align-items:center;
  }
  .eq-card-title { color:var(--white); font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .eq-num { background:rgba(255,255,255,0.15); color:var(--white); font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .eq-card-body { padding:18px; }
  .eq-fields-grid {
    display:grid; grid-template-columns:140px 1fr; gap:0;
    border:1px solid var(--gray-200); border-radius:6px; overflow:hidden;
    margin-bottom:14px; background:var(--white);
  }
  .eq-field-row { display:contents; }
  .eq-field-row .lbl {
    background:var(--gray-50); border-bottom:1px solid var(--gray-200);
    border-right:1px solid var(--gray-200);
    padding:7px 10px; font-size:12px; font-weight:700; color:var(--gray-600);
    display:flex; align-items:center;
  }
  .eq-field-row:last-child .lbl,
  .eq-field-row:last-child .val { border-bottom:none; }
  .eq-field-row .val {
    border-bottom:1px solid var(--gray-200);
    padding:4px 6px; display:flex; align-items:center;
  }
  .eq-field-row .val input {
    border:none; background:transparent; padding:4px 6px;
    font-size:13px; border-radius:4px;
  }
  .eq-field-row .val input:focus { background:var(--blue-light); box-shadow:none; border-color:transparent; }

  /* Tipo intervention within eq card */
  .eq-tipo-row {
    display:flex; gap:24px; margin-bottom:14px;
    padding:10px 12px; background:var(--white);
    border:1px solid var(--gray-200); border-radius:6px;
  }

  /* Checklist */
  .checklist-wrap { border:1px solid var(--gray-200); border-radius:6px; overflow:hidden; margin-bottom:14px; }
  .checklist-table { width:100%; border-collapse:collapse; font-size:13px; }
  .checklist-table th {
    background:var(--navy); color:rgba(255,255,255,0.85);
    font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.07em; padding:7px 10px; text-align:left;
  }
  .checklist-table th.c { text-align:center; }
  .checklist-table td { padding:5px 8px; border-bottom:1px solid var(--gray-200); vertical-align:middle; }
  .checklist-table tr:last-child td { border-bottom:none; }
  .checklist-table tr:hover td { background:#fafbff; }
  .checklist-table .num { width:32px; color:var(--gray-400); font-size:12px; text-align:center; }
  .checklist-table .sc { width:88px; text-align:center; }
  .checklist-table .sc select { padding:4px 5px; font-size:12px; width:100%; }
  .checklist-table .ac { width:110px; }
  .checklist-table .ac input { padding:4px 7px; font-size:12px; }
  .checklist-table .desc input { padding:4px 6px; font-size:13px; border:none; background:transparent; width:100%; }
  .checklist-table .desc input:focus { background:var(--blue-light); border-radius:3px; box-shadow:none; border:none; }
  .btn-add-item {
    display:flex; align-items:center; gap:6px; padding:7px 14px;
    background:none; border:none; color:var(--blue-bright);
    font-family:inherit; font-size:12px; font-weight:600;
    cursor:pointer; border-top:1px solid var(--gray-200); width:100%; text-align:left;
    transition:var(--transition);
  }
  .btn-add-item:hover { background:var(--blue-light); }
  .btn-remove { background:none; border:none; color:var(--gray-400); cursor:pointer; font-size:14px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:4px; transition:var(--transition); }
  .btn-remove:hover { background:#fee2e2; color:#ef4444; }

  /* Date row inside eq */
  .eq-date-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px; }

  /* Observations */
  .eq-obs textarea { font-size:13px; min-height:64px; }

  /* Photos */
  .photo-pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px; }
  .photo-col-label { font-size:11px; font-weight:700; color:var(--gray-600); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:6px; }
  .photo-slot {
    border:2px dashed var(--gray-300); border-radius:6px;
    min-height:140px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; cursor:pointer; position:relative;
    background:var(--white); transition:var(--transition); overflow:hidden;
  }
  .photo-slot:hover { border-color:var(--blue-bright); background:var(--blue-light); }
  .photo-slot.has-photo { border-style:solid; border-color:var(--blue); padding:4px; }
  .photo-slot img { max-width:100%; max-height:180px; object-fit:cover; border-radius:3px; display:block; }
  .photo-slot input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; border:none; padding:0; }
  .photo-slot .photo-label { font-size:11px; font-weight:600; color:var(--gray-400); text-transform:uppercase; letter-spacing:0.07em; }
  .photo-slot .photo-hint { font-size:11px; color:var(--gray-400); }
  .btn-rm-photo { position:absolute; top:5px; right:5px; background:rgba(0,0,0,0.5); color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:13px; display:none; align-items:center; justify-content:center; z-index:2; }
  .photo-slot.has-photo .btn-rm-photo { display:flex; }
  .photo-caption input { font-size:12px; padding:5px 8px; margin-top:5px; }
  .btn-add-photo-pair {
    display:flex; align-items:center; gap:6px; padding:7px 14px;
    background:none; border:1.5px dashed var(--gray-300); color:var(--blue-bright);
    font-family:inherit; font-size:12px; font-weight:600; cursor:pointer;
    border-radius:6px; width:100%; justify-content:center; margin-top:6px; transition:var(--transition);
  }
  .btn-add-photo-pair:hover { background:var(--blue-light); border-color:var(--blue-bright); }

  /* Add / Remove equipment */
  .btn-add-eq {
    display:flex; align-items:center; gap:8px; padding:12px 18px;
    background:none; border:2px dashed var(--gray-300); color:var(--blue-bright);
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
    border-radius:var(--radius); width:100%; justify-content:center; margin-top:4px; transition:var(--transition);
  }
  .btn-add-eq:hover { background:var(--blue-light); border-color:var(--blue-bright); }
  .btn-rm-eq {
    background:none; border:1.5px solid var(--gray-200); color:var(--gray-400);
    font-family:inherit; font-size:11px; font-weight:600; cursor:pointer;
    border-radius:6px; padding:4px 10px; transition:var(--transition);
    display:flex; align-items:center; gap:5px;
  }
  .btn-rm-eq:hover { border-color:#ef4444; color:#ef4444; background:#fef2f2; }

  /* Action bar */
  .actions-bar { margin-top:32px; padding-top:20px; border-top:1.5px solid var(--gray-200); display:flex; flex-direction:column; gap:14px; }
  .actions-row { display:flex; gap:8px; flex-wrap:wrap; }
  .actions-row.primary { justify-content:space-between; align-items:center; }
  .save-status { font-size:11px; color:var(--gray-400); display:flex; align-items:center; gap:6px; }
  .save-status.saved { color:var(--green); }
  .save-status .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .btn { display:inline-flex; align-items:center; gap:8px; font-family:inherit; font-size:13px; font-weight:600; border-radius:var(--radius-sm); padding:10px 16px; cursor:pointer; transition:var(--transition); border:1.5px solid var(--gray-200); background:var(--white); color:var(--gray-600); }
  .btn:hover { border-color:var(--blue-bright); color:var(--blue-bright); background:var(--gray-50); }
  .btn-danger { color:#b91c1c; }
  .btn-danger:hover { border-color:#ef4444; color:#ef4444; background:#fef2f2; }
  .btn-primary { background:linear-gradient(135deg,var(--blue) 0%,var(--blue-bright) 100%); color:var(--white); border-color:transparent; font-size:14px; font-weight:700; padding:13px 28px; border-radius:var(--radius); box-shadow:0 4px 14px rgba(37,99,235,0.35); }
  .btn-primary:hover { color:var(--white); background:linear-gradient(135deg,var(--blue-bright) 0%,var(--blue) 100%); border-color:transparent; transform:translateY(-1px); box-shadow:0 6px 20px rgba(37,99,235,0.45); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--navy); color:var(--white); padding:12px 20px; border-radius:var(--radius); font-size:13px; font-weight:500; box-shadow:var(--shadow-lg); z-index:200; opacity:0; transition:all 0.3s cubic-bezier(0.4,0,0.2,1); display:flex; align-items:center; gap:10px; }
  .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.success { background:linear-gradient(135deg,#10b981,#059669); }
  .toast.error { background:linear-gradient(135deg,#ef4444,#dc2626); }

  /* ── PRINT ── */
  .print-view { display:none; }
  @media print {
    @page { size:A4; margin:13mm 12mm 16mm 12mm; }
    body { background:#fff; }
    .page,.card,.card-body,.card-header,.actions-bar,.toast,form#mainForm { display:none !important; }
    .print-view { display:block !important; font-family:'DM Sans',system-ui,sans-serif; color:#000; font-size:9.5pt; line-height:1.4; }
    .print-view * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }

    .pv-page { page-break-after:always; }
    .pv-page:last-child { page-break-after:avoid; }

    /* Header (every page) */
    .pv-hdr { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #0a1628; padding-bottom:8px; margin-bottom:10px; }
    .pv-logo { height:24px; filter:brightness(0); }
    .pv-hdr-right { text-align:right; }
    .pv-doc-title { font-size:14pt; font-weight:700; color:#0a1628; }
    .pv-doc-ref { font-size:7.5pt; color:#888; }

    /* Client table — 2-column layout to save vertical space */
    .pv-client-grid { display:grid; grid-template-columns:1fr 1fr; gap:0; margin-bottom:5px; border:1px solid #cbd5e1; }
    .pv-tbl { width:100%; border-collapse:collapse; font-size:8.5pt; margin-bottom:0; }
    .pv-tbl td { border:1px solid #cbd5e1; padding:3px 7px; }
    .pv-tbl td.lbl { font-weight:700; background:#f1f5f9; white-space:nowrap; width:100px; }
    .pv-client-grid .pv-tbl { border:none; }
    .pv-client-grid .pv-tbl td { border-bottom:1px solid #cbd5e1; border-right:1px solid #cbd5e1; }
    .pv-client-grid .pv-tbl:last-child td { border-right:none; }
    .pv-client-grid .pv-tbl tr:last-child td { border-bottom:none; }

    /* Section title bar */
    .pv-sec-title { font-size:7.5pt; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:#fff; background:#0a1628; padding:3px 8px; }

    /* Equipment description table */
    .pv-eq-tbl { width:100%; border-collapse:collapse; font-size:8.5pt; margin-bottom:0; }
    .pv-eq-tbl td { border:1px solid #cbd5e1; padding:3px 7px; }
    .pv-eq-tbl td.lbl { font-weight:700; background:#f1f5f9; width:110px; white-space:nowrap; }
    .pv-tipo-row { display:flex; gap:24px; padding:4px 9px; border:1px solid #cbd5e1; border-top:none; font-size:8.5pt; }
    .pv-tipo-item { display:flex; align-items:center; gap:5px; }
    .pv-cb { width:10px; height:10px; border:1.5px solid #555; display:inline-flex; align-items:center; justify-content:center; font-size:7.5pt; line-height:1; flex-shrink:0; }
    .pv-cb.on { background:#0a1628; color:#fff; border-color:#0a1628; }

    /* Checklist */
    .pv-cl-label { font-style:italic; font-size:7.5pt; color:#555; margin:4px 0 1px 0; }
    .pv-cl { width:100%; border-collapse:collapse; font-size:8pt; }
    .pv-cl th { background:#1e293b; color:rgba(255,255,255,0.9); padding:3px 6px; text-align:left; font-size:7pt; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; }
    .pv-cl th.c { text-align:center; }
    .pv-cl td { border:1px solid #cbd5e1; padding:2px 6px; }
    .pv-cl td.c { text-align:center; }
    .pv-cl tr:nth-child(even) td { background:#f8fafc; }
    .pv-st { display:inline-block; font-weight:700; font-size:7.5pt; padding:1px 4px; border-radius:3px; }
    .pv-st.C  { background:#dcfce7; color:#166534; }
    .pv-st.NC { background:#fee2e2; color:#991b1b; }
    .pv-st.NA { background:#f1f5f9; color:#64748b; }

    /* Date row */
    .pv-date-row { display:flex; border:1px solid #cbd5e1; border-top:none; }
    .pv-dc { padding:3px 8px; border-right:1px solid #cbd5e1; font-size:8pt; white-space:nowrap; }
    .pv-dc:last-child { border-right:none; flex:1; font-size:7pt; color:#555; display:flex; align-items:center; }
    .pv-dc b { margin-right:3px; }

    /* Observations */
    .pv-obs { border:1px solid #cbd5e1; border-top:none; min-height:28px; padding:4px 7px; font-size:8.5pt; white-space:pre-wrap; }

    /* Photos */
    .pv-photo-sec { border:1px solid #cbd5e1; border-top:none; }
    .pv-photo-header { display:grid; grid-template-columns:1fr 1fr; background:#f1f5f9; border-bottom:1px solid #cbd5e1; }
    .pv-photo-col-lbl { text-align:center; font-size:7.5pt; font-weight:700; padding:3px; text-transform:uppercase; letter-spacing:0.05em; color:#444; border-right:1px solid #cbd5e1; }
    .pv-photo-col-lbl:last-child { border-right:none; }
    .pv-photo-row { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid #cbd5e1; }
    .pv-photo-row:first-child { border-top:none; }
    .pv-photo-cell { padding:4px; border-right:1px solid #cbd5e1; display:flex; flex-direction:column; gap:2px; }
    .pv-photo-cell:last-child { border-right:none; }
    .pv-photo-frame { width:100%; height:100px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#f8fafc; border:1px solid #e2e8f0; }
    .pv-photo-frame img { max-width:100%; max-height:100%; object-fit:cover; }
    .pv-photo-cap { font-size:7pt; color:#666; text-align:center; }

    /* Technician / next visit */
    .pv-footer-tbl { width:100%; border-collapse:collapse; margin-top:4px; }
    .pv-footer-tbl td { border:1px solid #cbd5e1; padding:4px 7px; width:50%; }
    .pv-footer-tbl td.lbl { font-weight:700; background:#1e293b; color:#fff; font-size:7pt; text-transform:uppercase; letter-spacing:0.05em; }

    /* Company footer — normal flow, kept with footer table, never breaks away */
    .pv-footer-tbl { page-break-inside: avoid; }
    .pv-company {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 8px;
      padding-top: 5px;
      border-top: 1px solid #e2e8f0;
      page-break-inside: avoid;
    }
    .pv-company .left { font-size:7pt; color:#888; line-height:1.5; }
    .pv-company .right { font-size:7pt; color:#aaa; text-align:right; }
    .pv-footer-wrap { page-break-inside: avoid; margin-top: 6px; }
  }

    @media (max-width:600px) {
    .card-header,.card-body { padding:24px 20px; }
    .grid-2,.grid-2.asym,.grid-3,.grid-4 { grid-template-columns:1fr; }
    .photo-pair { grid-template-columns:1fr; }
    .header-title { font-size:22px; }
    .actions-row.primary { flex-direction:column; align-items:stretch; }
    .btn-primary { width:100%; justify-content:center; }
  }
</style>

    <div class="card-body">
      <form id="mainForm" onsubmit="return false;">

        <!-- CLIENTE -->
        <div class="section">
          <div class="section-label">Dados do Cliente</div>
          <div class="grid-2 asym" style="margin-bottom:14px;">
            <div class="field-group"><label for="cliente">Cliente <span class="req">*</span></label><input type="text" id="cliente" placeholder="Nome da entidade cliente…"></div>
            <div class="field-group"><label for="nif">NIF</label><input type="text" id="nif" placeholder="Ex: 500246467"></div>
          </div>
          <div class="field-group" style="margin-bottom:14px;"><label for="morada">Morada</label><input type="text" id="morada" placeholder="Rua, número, código postal, cidade…"></div>
          <div class="field-group"><label for="projecto">Projecto</label><input type="text" id="projecto" placeholder="Nome ou descrição do projecto…"></div>
        </div>

        <hr>

        <!-- EQUIPAMENTOS -->
        <div class="section">
          <div class="section-label">Equipamentos Intervencionados</div>
          <div class="eq-list" id="eq-list"></div>
          <button type="button" class="btn-add-eq" id="btn-add-eq" style="margin-top:12px;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Adicionar Equipamento
          </button>
        </div>

        <!-- ACTIONS -->
        <div class="actions-bar">
          <div class="actions-row primary">
            <div class="save-status" id="save-status">
              <div class="dot"></div><span id="save-text">A carregar…</span>
            </div>
            <button type="submit" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 4.5L6 12 2.5 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Confirmar Registo
            </button>
          </div>
          <div class="actions-row">
            <button type="button" class="btn" id="btn-pdf">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="2" y="1" width="9" height="13" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 5h5M5 7.5h5M5 10h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9 1v3.5h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              Exportar PDF
            </button>
            <button type="button" class="btn" id="btn-json">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M4 3C2.9 3 2 3.9 2 5v5c0 1.1.9 2 2 2M11 3c1.1 0 2 .9 2 2v5c0 1.1-.9 2-2 2M6 5l1.5 5L9 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Exportar JSON
            </button>
            <button type="button" class="btn" id="btn-import">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2v8M4 7l3.5 3.5L11 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              Importar JSON
            </button>
            <button type="button" class="btn btn-danger" id="btn-clear">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 3l9 9M12 3l-9 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              Limpar
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>

<script>
(function(){
  const SK = 'dgw_relatorio_v3';
  const DEFAULT_CL = [
    'Equipamento fechado e trancado',
    'Estado geral da estrutura',
    'Estado da base de suporte do poste e respetivos parafusos',
    'Estado do equipamento',
    'Funcionamento do Equipamento',
    'Funcionamento da Frontlight',
    'Comunicações',
    'Funcionamento dos botões',
    'Template correto e funcional',
    'Áudio funcional',
    'Etiqueta de identificação do equipamento',
    'Estado da Cablagem',
  ];

  const $ = id => document.getElementById(id);
  let eqCount = 0;
  let photoData = {};

  // Toast
  let toastTimer;
  function toast(msg, type='') {
    const t = $('toast'); t.textContent = msg;
    t.className = 'toast visible ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('visible'), 2800);
  }

  // State select
  function mkState(val='') {
    const s = document.createElement('select');
    ['','C','NC','NA'].forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o || '—';
      if (o === val) opt.selected = true;
      s.appendChild(opt);
    });
    s.addEventListener('change', scheduleSave);
    return s;
  }

  // Checklist row
  function addClItem(tbody, desc='', ei='', ac='', ef='') {
    const n = tbody.rows.length + 1;
    const tr = document.createElement('tr');
    const descIn = document.createElement('input');
    descIn.type='text'; descIn.value=desc; descIn.placeholder='Descrição do item…';
    descIn.addEventListener('input', scheduleSave);
    const acIn = document.createElement('input');
    acIn.type='text'; acIn.value=ac; acIn.placeholder='Ex: Substituição';
    acIn.addEventListener('input', scheduleSave);
    tr.innerHTML = `<td class="num">${n}</td><td class="desc"></td><td class="sc c"></td><td class="ac"></td><td class="sc c"></td><td><button type="button" class="btn-remove" title="Remover">✕</button></td>`;
    tr.cells[1].appendChild(descIn);
    tr.cells[2].appendChild(mkState(ei));
    tr.cells[3].appendChild(acIn);
    tr.cells[4].appendChild(mkState(ef));
    tr.cells[5].querySelector('.btn-remove').addEventListener('click', () => {
      tr.remove();
      Array.from(tbody.rows).forEach((r,i) => r.cells[0].textContent = i+1);
      scheduleSave();
    });
    tbody.appendChild(tr);
  }

  // Photo slot
  function setupSlot(slotEl, key) {
    const fi = slotEl.querySelector('input[type="file"]');
    const rb = slotEl.querySelector('.btn-rm-photo');
    fi.addEventListener('change', e => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ev => { photoData[key] = ev.target.result; renderSlot(slotEl, key); scheduleSave(); };
      r.readAsDataURL(f);
    });
    rb.addEventListener('click', e => {
      e.stopPropagation();
      delete photoData[key]; renderSlot(slotEl, key); fi.value=''; scheduleSave();
    });
    slotEl.addEventListener('dragover', e => { e.preventDefault(); slotEl.style.borderColor='var(--blue-bright)'; });
    slotEl.addEventListener('dragleave', () => slotEl.style.borderColor='');
    slotEl.addEventListener('drop', e => {
      e.preventDefault(); slotEl.style.borderColor='';
      const f = e.dataTransfer.files[0]; if(!f||!f.type.startsWith('image/')) return;
      const r = new FileReader();
      r.onload = ev => { photoData[key] = ev.target.result; renderSlot(slotEl, key); scheduleSave(); };
      r.readAsDataURL(f);
    });
  }

  function renderSlot(slotEl, key) {
    const existing = slotEl.querySelector('img'); if(existing) existing.remove();
    const lbl = slotEl.querySelector('.photo-label');
    const hint = slotEl.querySelector('.photo-hint');
    if(photoData[key]) {
      slotEl.classList.add('has-photo');
      const img = document.createElement('img'); img.src = photoData[key];
      slotEl.insertBefore(img, slotEl.querySelector('.btn-rm-photo'));
      if(lbl) lbl.style.display='none'; if(hint) hint.style.display='none';
    } else {
      slotEl.classList.remove('has-photo');
      if(lbl) lbl.style.display=''; if(hint) hint.style.display='';
    }
  }

  function buildPhotoPair(eqN, pairN) {
    const ak = `eq-${eqN}-antes-${pairN}`;
    const dk = `eq-${eqN}-depois-${pairN}`;
    const wrap = document.createElement('div');
    wrap.className = 'photo-pair'; wrap.dataset.pair = pairN;
    wrap.innerHTML = `
      <div style="grid-column:1/-1;display:flex;justify-content:flex-end;margin-bottom:4px;">
        ${pairN===1 ? '' : `<button type="button" class="btn-rm-pair" title="Remover par de fotografias" style="background:none;border:1.5px solid var(--gray-200);color:var(--gray-400);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;border-radius:6px;padding:3px 10px;display:flex;align-items:center;gap:4px;transition:var(--transition);" onmouseover="this.style.borderColor='#ef4444';this.style.color='#ef4444';this.style.background='#fef2f2'" onmouseout="this.style.borderColor='var(--gray-200)';this.style.color='var(--gray-400)';this.style.background='none'">✕ Remover par</button>`}
      </div>
      <div>
        ${pairN===1 ? '<div class="photo-col-label">Antes</div>' : ''}
        <div class="photo-slot" id="slot-${ak}">
          <input type="file" accept="image/*">
          <div class="photo-label">Foto Antes</div>
          <div class="photo-hint">Clique ou arraste</div>
          <button type="button" class="btn-rm-photo">✕</button>
        </div>
        <input type="text" id="cap-${ak}" placeholder="Legenda…" style="font-size:12px;padding:5px 8px;margin-top:5px;">
      </div>
      <div>
        ${pairN===1 ? '<div class="photo-col-label">Depois</div>' : ''}
        <div class="photo-slot" id="slot-${dk}">
          <input type="file" accept="image/*">
          <div class="photo-label">Foto Depois</div>
          <div class="photo-hint">Clique ou arraste</div>
          <button type="button" class="btn-rm-photo">✕</button>
        </div>
        <input type="text" id="cap-${dk}" placeholder="Legenda…" style="font-size:12px;padding:5px 8px;margin-top:5px;">
      </div>
    `;
    // Bind remove pair button (only on pairs after the first)
    const rmPairBtn = wrap.querySelector('.btn-rm-pair');
    if(rmPairBtn) {
      rmPairBtn.addEventListener('click', () => {
        delete photoData[ak]; delete photoData[dk];
        wrap.remove(); scheduleSave();
      });
    }
    setupSlot(wrap.querySelector(`#slot-${ak}`), ak);
    setupSlot(wrap.querySelector(`#slot-${dk}`), dk);
    wrap.querySelector(`#cap-${ak}`).addEventListener('input', scheduleSave);
    wrap.querySelector(`#cap-${dk}`).addEventListener('input', scheduleSave);
    return wrap;
  }

  function addEquipment(data) {
    eqCount++;
    const n = eqCount;
    const d = data || {};
    const card = document.createElement('div');
    card.className = 'eq-card'; card.id = `eq-card-${n}`; card.dataset.n = n;

    card.innerHTML = `
      <div class="eq-card-header">

          <span class="eq-num">#${n}</span> Equipamento

        <button type="button" class="btn-rm-eq">

          Remover
        </button>
      </div>
      <div class="eq-card-body">
        <div class="eq-fields-grid">

          <div class="eq-field-row"><div class="lbl">Modelo</div><div class="val"><input type="text" id="eq-${n}-modelo" placeholder="Ex: SC-EP-13D-O"></div></div>

                <th style="width:28px;"></th>
              </tr>
            </thead>
            <tbody id="cl-${n}"></tbody>
          </table>
          <button type="button" class="btn-add-item" id="btn-add-item-${n}">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="6" stroke="currentColor"/><path d="M6.5 4v5M4 6.5h5" stroke="currentColor" stroke-linecap="round"/></svg>

    $('eq-list').appendChild(card);

    // Populate fields
    $(`eq-${n}-tipo`).value = d.tipo||'';

    $(`eq-${n}-serie`).value = d.serie||'';
    $(`eq-${n}-id`).value = d.eqId||'';
    $(`eq-${n}-inst`).checked = !!d.inst;
    $(`eq-${n}-gar`).checked = !!d.gar;
    $(`eq-${n}-man`).checked = !!d.man;
    if(d.data) $(`eq-${n}-data`).value = d.data;
    else $(`eq-${n}-data`).valueAsDate = new Date();
    $(`eq-${n}-hora`).value = d.hora||'';
    $(`eq-${n}-dur`).value = d.dur||'';
    $(`eq-${n}-obs`).value = d.obs||'';
    $(`eq-${n}-tec`).value = d.tec||'';
    if(d.prox) $(`eq-${n}-prox`).value = d.prox;

    // Checklist
    const tbody = $(`cl-${n}`);
    const items = (d.checklist && d.checklist.length) ? d.checklist : DEFAULT_CL.map(x => ({desc:x,ei:'',ac:'',ef:''}));
    items.forEach(it => addClItem(tbody, it.desc, it.ei, it.ac, it.ef));

    // Photo pairs
    let pairCount = 0;
    const photosWrap = $(`photos-${n}`);

    function addPair(pN) {
      pairCount = pN || (pairCount + 1);
      const pair = buildPhotoPair(n, pairCount);
      photosWrap.appendChild(pair);
      return pairCount;
    }

    const numPairs = (d.photoPairs && d.photoPairs.length) ? d.photoPairs.length : 1;
    for(let i=1; i<=numPairs; i++) addPair(i);

    // Restore captions

      addClItem($(`cl-${n}`)); scheduleSave();

    $(`btn-add-photo-${n}`).addEventListener('click', () => {
      addPair(); scheduleSave();
    });

    // Listen all inputs
    card.querySelectorAll('input:not([type="file"]),textarea,select').forEach(el => {
      el.addEventListener('input', scheduleSave);
      el.addEventListener('change', scheduleSave);
    });

    return card;
  }

  // Collect
  function escH(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function collectEq(n) {
    const tbody = $(`cl-${n}`);
    const checklist = Array.from(tbody.rows).map(r => ({
      desc: r.cells[1].querySelector('input').value.trim(),
      ei: r.cells[2].querySelector('select').value,
      ac: r.cells[3].querySelector('input').value.trim(),
      ef: r.cells[4].querySelector('select').value,
    }));
    const caps = {};
    document.querySelectorAll(`[id^="cap-eq-${n}-"]`).forEach(el => { caps[el.id] = el.value.trim(); });
    const photoPairs = Array.from(($(`photos-${n}`)||{querySelectorAll:()=>[]}).querySelectorAll('.photo-pair')).map((_,i)=>i+1);
    return {
      tipo: $(`eq-${n}-tipo`).value.trim(),
      modelo: $(`eq-${n}-modelo`).value.trim(),
      loc: $(`eq-${n}-loc`).value.trim(),
      serie: $(`eq-${n}-serie`).value.trim(),
      eqId: $(`eq-${n}-id`).value.trim(),
      inst: $(`eq-${n}-inst`).checked,
      gar: $(`eq-${n}-gar`).checked,
      man: $(`eq-${n}-man`).checked,
      checklist,
      data: $(`eq-${n}-data`).value,
      hora: $(`eq-${n}-hora`).value,
      dur: $(`eq-${n}-dur`).value.trim(),
      obs: $(`eq-${n}-obs`).value,
      tec: $(`eq-${n}-tec`).value.trim(),
      prox: $(`eq-${n}-prox`).value,
      caps, photoPairs,
    };
  }

  function collect() {
    const equipamentos = [];
    document.querySelectorAll('.eq-card').forEach(card => {
      equipamentos.push(collectEq(parseInt(card.dataset.n)));
    });
    return {
      _meta: { app:'DIGIWEST Relatório Intervenção', version:3, savedAt:new Date().toISOString() },
      cliente: $('cliente').value.trim(),
      nif: $('nif').value.trim(),
      morada: $('morada').value.trim(),
      projecto: $('projecto').value.trim(),
      equipamentos,
    };
  }

  function apply(d) {
    if(!d) return;
    $('cliente').value = d.cliente||'';
    $('nif').value = d.nif||'';
    $('morada').value = d.morada||'';
    $('projecto').value = d.projecto||'';
    $('eq-list').innerHTML = ''; eqCount = 0;
    if(d.equipamentos && d.equipamentos.length) d.equipamentos.forEach(eq => addEquipment(eq));
    else addEquipment();
  }

  // Auto-save
  let saveTimer;
  function scheduleSave() {
    const s=$('save-status'), t=$('save-text');
    s.classList.remove('saved'); t.textContent='A guardar…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 700);
  }
  function doSave() {
    try {
      localStorage.setItem(SK, JSON.stringify(collect()));
      $('save-status').classList.add('saved'); $('save-text').textContent='Guardado';
    } catch(e){ console.warn('Save failed',e); }
  }

  // Load on start
  try {
    const saved = JSON.parse(localStorage.getItem(SK));
    if(saved && saved.equipamentos && saved.equipamentos.length) apply(saved);
    else addEquipment();
  } catch(e) { addEquipment(); }

  // Buttons
  $('btn-add-eq').addEventListener('click', () => { addEquipment(); scheduleSave(); });

  // Filename
  function filename(d) {
    const cli = (d.cliente||'relatorio').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').slice(0,20);
    const first = d.equipamentos && d.equipamentos[0];
    const loc = first && first.loc ? first.loc.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9 ]+/g,'').replace(/\s+/g,'_').slice(0,20) : '';
    let dt = '';
    if(first && first.data) { const [y,m,day]=first.data.split('-'); dt=`${day}_${m}_${y}`; }
    return ['Relatorio_Intervencao',cli,loc,dt].filter(Boolean).join('_');
  }

  // Print render
  function fmtDate(s) { if(!s) return '—'; const[y,m,dd]=s.split('-'); return `${dd}/${m}/${y}`; }
  function stBadge(v) { return v ? `<span class="pv-st ${v}">${v}</span>` : '<span style="color:#bbb">—</span>'; }
  function cb(on) { return `<span class="pv-cb${on?' on':''}">${on?'✓':''}</span>`; }

  function renderPrint() {
    const d = collect();
    const cards = document.querySelectorAll('.eq-card');
    let pages = '';
    cards.forEach((card, i) => {
      const n = parseInt(card.dataset.n);
      pages += buildPage(collectEq(n), n, d, i===0);
    });
    $('printView').innerHTML = pages;
  }

  $('btn-pdf').addEventListener('click', () => {
    renderPrint();
    const d = collect();
    const orig = document.title;
    document.title = filename(d);
    setTimeout(() => { window.print(); setTimeout(() => { document.title = orig; }, 500); }, 100);
  });

  $('btn-json').addEventListener('click', () => {
    const d = collect();
    const blob = new Blob([JSON.stringify(d,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = filename(d) + '.json'; a.click();
    toast('✓ JSON exportado', 'success');
  });

  $('btn-import').addEventListener('click', () => $('import-input').click());
  $('import-input').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.photoData) photoData = d.photoData;
        apply(d); toast('✓ Dados importados', 'success');
      } catch(err) { toast('Erro ao importar JSON', 'error'); }
    };
    r.readAsText(f); e.target.value='';
  });

  $('btn-clear').addEventListener('click', () => {
    if(!confirm('Limpar todos os dados do formulário?')) return;
    localStorage.removeItem(SK); photoData={};
    $('cliente').value=''; $('nif').value=''; $('morada').value=''; $('projecto').value='';
    $('eq-list').innerHTML=''; eqCount=0;
    addEquipment(); toast('Formulário limpo','');
  });

  $('mainForm').addEventListener('submit', e => {
    e.preventDefault();
    if(!$('cliente').value.trim()) { $('cliente').focus(); toast('Indique o cliente','error'); return; }
    doSave(); toast('✓ Relatório confirmado e guardado','success');
  });

  doSave();
  $('save-text').textContent='Pronto'; $('save-status').classList.add('saved');
})();
</script>
</body>
</html>
